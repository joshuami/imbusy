name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
      - name: Release build
        run: swift build -c release
      - name: Check embedded Info.plist
        run: |
          BIN="$(swift build -c release --show-bin-path)/imbusy"
          otool -s __TEXT __info_plist "$BIN" | grep -q __info_plist
          "$BIN" --version
